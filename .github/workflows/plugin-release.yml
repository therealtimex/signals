# Marketplace plugin + standalone artifact CI gate and releases.
# See docs/realtimex-marketplace-plugin.md

name: Plugin release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: plugin-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-package:
    name: Marketplace bundle
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify marketplace version alignment
        run: npm run verify:marketplace-versions

      - name: Build standalone artifact and release manifest
        run: npm run build:standalone-artifact
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data

      - name: Package RealtimeX plugin zip
        run: npm run package:realtimex-plugin

      - name: Test plugin package structure and adapter
        run: npm run test:plugin-package

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            node scripts/ci/should-publish-marketplace-release.mjs --tag="${{ github.ref_name }}"
          else
            node scripts/ci/should-publish-marketplace-release.mjs --main
          fi | tee /tmp/publish-action.txt
          echo "action=$(cat /tmp/publish-action.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.publish.outputs.action == 'publish'
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.publish.outputs.action == 'publish'
        run: npm ci

      - name: Verify marketplace version alignment
        if: steps.publish.outputs.action == 'publish'
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npm run verify:marketplace-versions -- --tag="${GITHUB_REF_NAME}"
          else
            npm run verify:marketplace-versions
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build standalone artifact and release manifest
        if: steps.publish.outputs.action == 'publish'
        run: npm run build:standalone-artifact
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data

      - name: Package RealtimeX plugin zip
        if: steps.publish.outputs.action == 'publish'
        run: npm run package:realtimex-plugin

      - name: Test plugin package structure and adapter
        if: steps.publish.outputs.action == 'publish'
        run: npm run test:plugin-package

      - name: Stage release artifacts
        if: steps.publish.outputs.action == 'publish'
        id: stage
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-upload
          cp "dist/com.realtimex.signals-plugin.zip" release-upload/
          cp "dist/signals-${VERSION}-standalone.zip" release-upload/
          cp marketplace/release-manifest.json release-upload/

      - name: Create GitHub Release
        if: steps.publish.outputs.action == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stage.outputs.version }}
          files: release-upload/*
          generate_release_notes: true
