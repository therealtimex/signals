# Fast pull-request feedback. Release packaging is intentionally isolated in
# release.yml so ordinary development never waits on native artifact builds.

name: PR quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          # React Doctor needs the merge base to report only PR-introduced issues.
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          blocking: error
          version: "0.9.12"

  # gofmt parses but does not type-check, and Go is otherwise compiled only in
  # release.yml — so a broken overlay reaches the release pipeline with a green PR.
  # This is the cheapest gate that actually type-checks tools/signals-pp-cli.
  signals-pp-cli:
    name: signals-pp-cli compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      # tools/signals-pp-cli/source is generated at build time, so it has no committed
      # go.sum for setup-go's own cache to key on — every run re-downloaded the whole
      # module graph and re-compiled the generator. That is minutes of proxy traffic per
      # PR and a fresh roll of the dice on proxy.golang.org each time; one dropped stream
      # (INTERNAL_ERROR mid-zip) fails the job with nothing wrong in the diff.
      #
      # The key covers everything that decides the module graph: the pinned generator
      # version and Go toolchain in the build script, the spec the CLI is generated from,
      # and the hand-written overlay whose imports get compiled alongside it. ~/go/bin
      # carries the generator binary itself — build-signals-pp-cli.mjs compares
      # `cli-printing-press --version` against its pin and reinstalls on a mismatch, so a
      # stale hit cannot be silently used.
      - name: Cache Go modules and the CLI generator
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
            ~/.cache/go-build
          key: ${{ runner.os }}-signals-pp-cli-go-${{ hashFiles('scripts/build-signals-pp-cli.mjs', 'openapi/agent-tools.json', 'tools/signals-pp-cli/transcendence/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-signals-pp-cli-go-

      - name: Install dependencies
        run: npm ci

      # Generates the CLI from openapi/agent-tools.json, overlays
      # tools/signals-pp-cli/transcendence/*.go, then runs go vet + go build.
      # Host target only; cross-compilation stays in release.yml.
      #
      # Retried once: a cold cache still fetches from proxy.golang.org, and that fetch is
      # the only part of this job that can fail without anything being wrong. A real
      # compile error fails both attempts and still fails the job.
      - name: Build signals-pp-cli
        run: |
          npm run build:signals-pp-cli && exit 0
          echo "::warning::build:signals-pp-cli failed once — retrying in case the Go module proxy dropped a fetch"
          sleep 15
          npm run build:signals-pp-cli

      # Only runs for real once a binary exists — it self-skips otherwise.
      - name: signals-pp-cli golden tests
        run: npm run test:signals-pp-cli

  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Verify RealtimeX Node runtime
        run: npm run verify:node-runtime

      - name: Verify marketplace contract
        run: npm run verify:marketplace-versions

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check:all
        env:
          # Boot/migrate touches ~/.signals — keep CI hermetic under the workspace.
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data

      - name: Verify fresh data dir import safety
        run: npm run verify:fresh-import

      - name: Run integration smoke tests
        run: npm run test:integration
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-e2e
          E2E_FRESH_DB: "1"
          CI: "true"
