# Pull-request quality checks, marketplace packaging, and gated releases.
# See: https://github.com/therealtimex/signals/issues/15

name: CI and release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  # Replace stale PR runs, but serialize main/tag runs so an active publish is
  # never cancelled halfway through by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release_plan:
    name: Release plan
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ steps.plan.outputs.action }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Select validation targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ACTION="validate"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ACTION="$(node scripts/ci/should-publish-marketplace-release.mjs --tag="${{ github.ref_name }}")"
          else
            ACTION="$(node scripts/ci/should-publish-marketplace-release.mjs --main)"
          fi

          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"
          if [[ "$ACTION" == "publish" ]]; then
            echo 'matrix={"include":[{"target":"darwin-arm64","runner":"macos-15"},{"target":"darwin-x64","runner":"macos-15-intel"},{"target":"win32-x64","runner":"windows-2025"},{"target":"linux-x64","runner":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"target":"linux-x64","runner":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
          fi

  react-doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          # React Doctor needs the merge base to report only PR-introduced issues.
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          # Error-severity findings must block a release. Pin the scanner so the
          # release gate cannot change underneath an otherwise identical commit.
          blocking: error
          version: "0.9.12"

  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check
        env:
          # Boot/migrate touches ~/.signals — keep CI hermetic under the workspace.
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data

  smoke:
    name: Smoke (integration)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify fresh data dir import safety
        run: npm run verify:fresh-import

      - name: Build production app
        run: |
          npm run db:migrate
          SIGNALS_BOOT_MIGRATIONS_DONE=1 npm run build
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data

      - name: Run integration smoke tests
        run: npm run test:integration
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-e2e
          E2E_FRESH_DB: "1"
          CI: "true"

  standalone-artifacts:
    name: Runtime (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release_plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    needs: [check, release_plan]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build native signals-pp-cli
        run: npm run build:signals-pp-cli

      - name: Test signals-pp-cli import golden
        run: npm run test:signals-pp-cli

      - name: Build native standalone artifact
        run: npm run build:standalone-artifact
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data
          SIGNALS_ARTIFACT_TARGET: ${{ matrix.target }}

      - name: Test standalone runtime artifact
        run: npm run test:standalone-artifact

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/signals-*-${{ matrix.target }}.tar.gz
            dist/release-target-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 2

  plugin-package:
    name: Marketplace bundle
    runs-on: ubuntu-24.04
    needs: [standalone-artifacts, release_plan]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build cross-platform signals-pp-cli
        run: SIGNALS_PP_CLI_CROSS_COMPILE=1 npm run build:signals-pp-cli

      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Verify marketplace version alignment
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npm run verify:marketplace-versions -- --tag="${GITHUB_REF_NAME}"
          else
            npm run verify:marketplace-versions
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Merge platform release manifests
        run: npm run merge:release-manifests
        env:
          SIGNALS_REQUIRED_ARTIFACT_TARGETS: ${{ needs.release_plan.outputs.action == 'publish' && 'darwin-arm64,darwin-x64,win32-x64,linux-x64' || 'linux-x64' }}

      - name: Sign release manifest
        if: needs.release_plan.outputs.action == 'publish'
        run: npm run sign:release-manifest
        env:
          SIGNALS_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.SIGNALS_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          SIGNALS_RELEASE_SIGNING_KEY_ID: ${{ vars.SIGNALS_RELEASE_SIGNING_KEY_ID }}

      - name: Package RealtimeX plugin zip
        run: npm run package:realtimex-plugin
        env:
          SIGNALS_REQUIRE_RELEASE_SIGNATURE: ${{ needs.release_plan.outputs.action == 'publish' && '1' || '0' }}

      - name: Test plugin package structure and adapter
        run: npm run test:plugin-package
        env:
          SIGNALS_REQUIRE_RELEASE_SIGNATURE: ${{ needs.release_plan.outputs.action == 'publish' && '1' || '0' }}

      - name: Stage verified release artifacts
        if: needs.release_plan.outputs.action == 'publish'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release-upload
          cp "dist/com.realtimex.signals-plugin.zip" release-upload/
          cp dist/signals-${VERSION}-*.tar.gz release-upload/
          cp marketplace/release-manifest.json release-upload/
          cp marketplace/release-manifest.sig.json release-upload/

      - name: Upload verified release artifacts
        if: needs.release_plan.outputs.action == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release_plan, react-doctor, check, smoke, plugin-package]
    if: needs.release_plan.outputs.action == 'publish'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: release-upload

      - name: Read release version
        id: release-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release-version.outputs.version }}
          files: release-upload/*
          generate_release_notes: true
