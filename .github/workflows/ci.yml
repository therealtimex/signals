# Pull-request quality checks, marketplace packaging, and gated releases.
# See: https://github.com/therealtimex/signals/issues/15

name: CI and release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  # Replace stale PR runs, but serialize main/tag runs so an active publish is
  # never cancelled halfway through by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          # React Doctor needs the merge base to report only PR-introduced issues.
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          # Error-severity findings must block a release. Pin the scanner so the
          # release gate cannot change underneath an otherwise identical commit.
          blocking: error
          version: "0.9.12"

  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run check
        env:
          # Boot/migrate touches ~/.signals — keep CI hermetic under the workspace.
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data

  smoke:
    name: Smoke (integration)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify fresh data dir import safety
        run: npm run verify:fresh-import

      - name: Build production app
        run: npm run build
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data

      - name: Run integration smoke tests
        run: npm run test:integration
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-e2e
          E2E_FRESH_DB: "1"
          CI: "true"

  plugin-package:
    name: Marketplace bundle
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify marketplace version alignment
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npm run verify:marketplace-versions -- --tag="${GITHUB_REF_NAME}"
          else
            npm run verify:marketplace-versions
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build standalone artifact and release manifest
        run: npm run build:standalone-artifact
        env:
          SIGNALS_DATA_DIR: ${{ github.workspace }}/.ci/signals-data

      - name: Test standalone runtime artifact
        run: npm run test:standalone-artifact

      - name: Package RealtimeX plugin zip
        run: npm run package:realtimex-plugin

      - name: Test plugin package structure and adapter
        run: npm run test:plugin-package

      - name: Stage verified release artifacts
        if: github.event_name == 'push'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release-upload
          cp "dist/com.realtimex.signals-plugin.zip" release-upload/
          cp "dist/signals-${VERSION}-standalone.zip" release-upload/
          cp marketplace/release-manifest.json release-upload/

      - name: Upload verified release artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [react-doctor, check, smoke, plugin-package]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            node scripts/ci/should-publish-marketplace-release.mjs --tag="${{ github.ref_name }}"
          else
            node scripts/ci/should-publish-marketplace-release.mjs --main
          fi | tee /tmp/publish-action.txt
          echo "action=$(cat /tmp/publish-action.txt)" >> "$GITHUB_OUTPUT"

      - name: Download verified release artifacts
        if: steps.publish.outputs.action == 'publish'
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.sha }}
          path: release-upload

      - name: Read release version
        if: steps.publish.outputs.action == 'publish'
        id: release-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.publish.outputs.action == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release-version.outputs.version }}
          files: release-upload/*
          generate_release_notes: true
